name: Keep-alive (Supabase + storage watchdog)

# Read-only production checks every six hours, plus post-merge checks.
# Scheduled workflows become active only after this file reaches the default branch.
on:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      url:
        description: 'HTTPS site origin to check (GET requests only)'
        type: string
        required: true
        default: 'https://panikajeevansathi.onrender.com'

permissions:
  contents: read

concurrency:
  group: production-safety-watchdog
  cancel-in-progress: false

jobs:
  keep-alive:
    name: Database, photo privacy, mail configuration and public security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SITE_URL: ${{ inputs.url || 'https://panikajeevansathi.onrender.com' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
      - name: Allow Render auto-deploy to finish
        if: github.event_name == 'push'
        run: sleep 300
      - name: Read-only production safety checks
        id: verify
        continue-on-error: true
        run: node scripts/verify-production.mjs --url "$SITE_URL" --output reports/production-safety-latest.md
      - name: Attempt an owner alert if verification failed
        if: steps.verify.outcome == 'failure'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ -z "$RESEND_API_KEY" ]; then
            echo "::warning::Alert email was NOT sent: RESEND_API_KEY is not configured."
          else
            node scripts/keepalive-alert.mjs --url "$SITE_URL" --status safety-check-failed --detail "Production safety checks failed. See this workflow's summary for the exact failed checks."
          fi
      - name: Preserve safe report (no credentials or member data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-safety-report
          path: reports/production-safety-latest.md
          if-no-files-found: ignore
          retention-days: 14
      - name: Failed checks must never be green
        if: always() && steps.verify.outcome != 'success'
        run: |
          echo "::error::Production safety is NOT fully verified. Review the report; an alert email is not guaranteed."
          exit 1
