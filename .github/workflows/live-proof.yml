name: Live proof (production durability)

# Creating/deleting synthetic members is MANUAL and opt-in, never scheduled.
# Use Keep-alive for routine read-only monitoring. A restart must actually
# be observed; waiting 17 minutes alone cannot establish durability.
on:
  workflow_dispatch:
    inputs:
      url:
        description: 'HTTPS site origin for the explicit write/read test'
        type: string
        required: true
        default: 'https://panikajeevansathi.onrender.com'
      wait_minutes:
        description: 'Idle minutes before read-back (restart is still required)'
        type: number
        required: true
        default: 17
      allow_test_members:
        description: 'I authorise temporary synthetic members, a photo and a message, followed by cleanup'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: live-proof
  cancel-in-progress: false

jobs:
  prove:
    if: inputs.allow_test_members
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PROOF_SITE_URL: ${{ inputs.url }}
      PROOF_WAIT_MINUTES: ${{ inputs.wait_minutes }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
      - name: Explicit test writes, observed restart, read-back and cleanup
        run: |
          set -o pipefail
          node scripts/verify-supabase-live.mjs --allow-test-members --url "$PROOF_SITE_URL" --wait-min "$PROOF_WAIT_MINUTES" 2>&1 | tee live-proof.log
      - name: Save verdict
        if: always()
        run: |
          echo '### Live durability proof' >> "$GITHUB_STEP_SUMMARY"
          grep -E 'PASS|FAIL|VERDICT' live-proof.log >> "$GITHUB_STEP_SUMMARY" || true
      - name: Save test-only log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-proof-log
          path: live-proof.log
          if-no-files-found: ignore
          retention-days: 7
