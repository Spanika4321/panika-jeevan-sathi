name: Pooja — SEO Growth Worker

on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pooja:
    name: SEO analysis & growth opportunities
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'

      - name: Run Pooja
        run: node agents/pooja.mjs

      - name: Upload Pooja report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pooja-seo-report
          path: reports/agents/pooja-latest.json
          if-no-files-found: ignore
