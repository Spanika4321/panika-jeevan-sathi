name: Supabase verify (production health)

# WHY THIS EXISTS
#   Permanent, independent health watch for the production database.
#   It polls the LIVE site's /api/health every 6 hours (plus on every push
#   and manually) and fails loudly (red in the Actions tab) the moment the
#   site is no longer on durable Supabase storage. This is the early-warning
#   layer that catches a silent fallback to ephemeral sqlite — the exact
#   failure mode that loses member data on a Render Free sleep/wake cycle.
#
# ROOT CAUSE WHEN IT GOES RED
#   storage != "supabase"  ->  the Render service lost its Supabase env vars.
#   Fix in the Render dashboard (service `panikajeevansathi` -> Environment):
#     SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, SUPABASE_STORAGE_BUCKET=uploads
#   then Save Changes -> Manual Deploy -> Deploy latest commit.

on:
  push:
    branches: ['**']
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check live /api/health
        run: |
          URL="https://panikajeevansathi.onrender.com/api/health"
          echo "GET $URL"
          BODY=""
          for i in 1 2 3 4 5 6; do
            BODY=$(curl -sS --max-time 60 "$URL" || true)
            [ -n "$BODY" ] && break
            echo "attempt $i: empty (free instance may be waking up), retrying..."
            sleep 15
          done

          {
            echo "## Production health — panikajeevansathi.onrender.com"
            echo ''
            echo '```json'
            echo "$BODY"
            echo '```'
            echo ''
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -z "$BODY" ]; then
            echo '**FAIL** — site did not respond.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          DB=$(printf '%s' "$BODY" | grep -o '"storage":"[^"]*"' | head -1 | cut -d'"' -f4)
          PH=$(printf '%s' "$BODY" | grep -o '"photos":"[^"]*"' | head -1 | cut -d'"' -f4)
          echo "storage=$DB photos=$PH"

          if [ "$DB" = "supabase" ]; then
            echo "**PASS** — database: \`$DB\`, photos: \`$PH\`. Data is durable in Supabase." >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "**FAIL** — database is \`$DB\` (expected \`supabase\`)."
              echo ''
              echo 'Fix: Render dashboard -> service `panikajeevansathi` -> Environment ->'
              echo 'set `SUPABASE_URL`, `SUPABASE_SERVICE_ROLE_KEY`, `SUPABASE_STORAGE_BUCKET=uploads`'
              echo '-> Save Changes -> Manual Deploy -> Deploy latest commit.'
              echo 'See SUPABASE.md.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
