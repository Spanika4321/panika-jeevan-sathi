# PANIKA JEEVAN SATHI — deploy to Render (Free plan)
#
# This file is installed as .github/workflows/deploy-render.yml (kept in sync
# with this template). Run it from the Actions tab with one click:
#   Actions → "Deploy to Render" → Run workflow
#
# Every credential is pasted into the form below, masked in the log with
# ::add-mask:: and NEVER stored in git or sent anywhere except the official
# api.render.com / api.supabase.com endpoints.
#
# Why this workflow exists: GitHub runners can reach api.render.com and
# onrender.com (a sandboxed dev machine cannot), so this is the path that
# deploys + verifies production from an agent session. It also switches the
# service to durable Supabase storage in the same run when the Supabase
# values are supplied — without them the Render Free disk is ephemeral and
# members/photos vanish at the next sleep or redeploy.
#
# Before the first Supabase deploy, run supabase/schema.sql once in the
# Supabase SQL editor (creates the users table, profiles, messages, …).

name: Deploy to Render

on:
  workflow_dispatch:
    inputs:
      render_api_key:
        description: 'Render API key (dashboard → Account Settings → API keys)'
        required: true
      branch:
        description: 'Git branch to deploy'
        required: false
        default: main
      supabase_url:
        description: 'Supabase project URL (https://<ref>.supabase.co) — leave blank to keep current storage'
        required: false
      supabase_service_role_key:
        description: 'Supabase service_role key (Supabase → Project Settings → API) — masked, never committed'
        required: false
      supabase_storage_bucket:
        description: 'Supabase Storage bucket for photos'
        required: false
        default: uploads
      cf_account_id:
        description: 'Cloudflare account ID (D1 + R2)'
        required: false
      cf_d1_database_id:
        description: 'Cloudflare D1 database ID'
        required: false
      cf_d1_api_token:
        description: 'Cloudflare API token with D1:Edit'
        required: false
      r2_account_id:
        description: 'Cloudflare account ID for R2'
        required: false
      r2_bucket:
        description: 'R2 bucket name'
        required: false
      r2_access_key_id:
        description: 'R2 access key ID'
        required: false
      r2_secret_access_key:
        description: 'R2 secret access key'
        required: false
      admin_email:
        description: 'Site-owner administrator email'
        required: false
        default: sukulpanika939@gmail.com
      admin_password:
        description: 'Administrator password (leave blank → Render generates one)'
        required: false

jobs:
  deploy:
    name: Create/update service and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Mask secrets in the log
        run: |
          for value in "${{ inputs.render_api_key }}" "${{ inputs.supabase_service_role_key }}" "${{ inputs.cf_d1_api_token }}" "${{ inputs.r2_access_key_id }}" "${{ inputs.r2_secret_access_key }}" "${{ inputs.admin_password }}"; do
            if [ -n "$value" ]; then echo "::add-mask::$value"; fi
          done

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'

      - name: Syntax check
        run: npm run check

      - name: Verify Cloudflare credentials (when supplied)
        if: inputs.cf_account_id != ''
        env:
          CF_ACCOUNT_ID: ${{ inputs.cf_account_id }}
          CF_D1_DATABASE_ID: ${{ inputs.cf_d1_database_id }}
          CF_D1_API_TOKEN: ${{ inputs.cf_d1_api_token }}
          R2_ACCOUNT_ID: ${{ inputs.r2_account_id }}
          R2_BUCKET: ${{ inputs.r2_bucket }}
          R2_ACCESS_KEY_ID: ${{ inputs.r2_access_key_id }}
          R2_SECRET_ACCESS_KEY: ${{ inputs.r2_secret_access_key }}
        run: node scripts/verify-cloud.mjs

      - name: Deploy to Render
        env:
          RENDER_API_KEY: ${{ inputs.render_api_key }}
        run: |
          node scripts/deploy-render.mjs \
            --branch "${{ inputs.branch }}" \
            --admin-email "${{ inputs.admin_email }}" \
            --supabase-url "${{ inputs.supabase_url }}" \
            --supabase-key "${{ inputs.supabase_service_role_key }}" \
            --supabase-bucket "${{ inputs.supabase_storage_bucket }}" \
            --cf-account-id "${{ inputs.cf_account_id }}" \
            --cf-d1-database-id "${{ inputs.cf_d1_database_id }}" \
            --cf-d1-api-token "${{ inputs.cf_d1_api_token }}" \
            --r2-account-id "${{ inputs.r2_account_id }}" \
            --r2-bucket "${{ inputs.r2_bucket }}" \
            --r2-access-key-id "${{ inputs.r2_access_key_id }}" \
            --r2-secret-access-key "${{ inputs.r2_secret_access_key }}" \
            --admin-password "${{ inputs.admin_password }}" \
          | tee deploy.log

      - name: Read the public URL
        id: url
        run: |
          # NOTE: block scalar is intentional — 'PUBLIC URL : ' contains ": "
          # which breaks a single-line YAML mapping value.
          site="$(grep -o 'PUBLIC URL : .*' deploy.log | head -1 | sed 's/PUBLIC URL : //')"
          echo "site=$site" >> "$GITHUB_OUTPUT"

      - name: Verify the live website
        env:
          SITE_URL: ${{ steps.url.outputs.site }}
        run: node scripts/verify-cloud.mjs --url "$SITE_URL"

      - name: Durability reminder
        if: always()
        run: |
          if grep -q 'Durable    : NO' deploy.log 2>/dev/null; then
            echo "::warning::Site is live but NOT durable (sqlite/json). Run supabase/schema.sql in the Supabase SQL editor, then re-run this workflow with the Supabase URL + service_role key so members survive Render restarts."
          fi
