name: Worker Recovery

on:
  workflow_dispatch:
    inputs:
      worker:
        description: "Failed worker"
        required: true
        type: choice
        options:
          - pooja
          - priya

permissions:
  contents: read

jobs:
  recovery:
    name: Isolated worker recovery
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'

      - name: Create recovery clone
        env:
          WORKER_NAME: ${{ inputs.worker }}
        run: node scripts/worker-recovery.mjs "$WORKER_NAME"

      - name: Run project syntax check
        run: npm run check

      - name: Run full tests
        run: npm test

      - name: Recovery policy
        run: |
          echo "Recovery clone verified."
          echo "Production deployment NOT performed."
          echo "Git push NOT performed."
          echo "External posting NOT performed."
