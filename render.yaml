# PANIKA JEEVAN SATHI + SEVA MARKET INDIA — Render Blueprint (Free plan)
#
# Deploy: Render dashboard → New + → Blueprint → pick this repository.
# This one file creates and manages BOTH services:
#
#     panikajeevansathi    https://panikajeevansathi.onrender.com
#     seva-market-india    https://seva-market-india-tast.onrender.com (current Render URL; suffixes can differ)
#
# Render reads exactly one blueprint file per repository, so a subfolder's
# render.yaml is only a copy. The SEVA block at the bottom is kept byte
# identical to seva-market-india/render.yaml, and its test suite fails if the
# two ever drift — editing one alone is how a deploy ends up different from the
# code you reviewed.
#
# IMPORTANT — why there is no disk here:
# Render's Free plan has an *ephemeral* filesystem and cannot attach a
# persistent disk, so a SQLite file under ./data is erased every time the
# service sleeps (15 min idle) or redeploys. This Blueprint therefore keeps
#   • the member database in Supabase Postgres  (PostgREST)
#   • uploaded photos in Supabase Storage
# Both are reached over HTTPS by lib/supabase.js — write-through, no local queue.
# Cloudflare D1/R2 remain supported as a fallback when SUPABASE_* is unset
# but CF_*/R2_* is set.
#
# Fill in SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY in the Render dashboard
# (Settings → Environment). Run supabase/schema.sql once in the Supabase SQL
# editor before the first boot.
#
# PJS_REQUIRE_REMOTE=1 (and SITE_URL on onrender.com) refuse to boot with
# local sqlite. That fail-closed path is the only way Render sleep cannot
# silently recreate an empty site.

services:
  - type: web
    name: panikajeevansathi
    runtime: node
    plan: free
    region: singapore # closest Render region to India
    buildCommand: npm ci --omit=dev --ignore-scripts
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeploy: true # redeploy automatically when main changes
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY_HOPS
        value: '1' # Render edge appends the client address
      - key: NODE_VERSION
        value: 22.22.3 # built-in node:sqlite (and global fetch) required
      - key: HOST
        value: 0.0.0.0
      - key: PJS_STORAGE
        value: supabase # refuse sqlite/D1 on this host — SUPABASE_* must be set
      - key: PJS_REQUIRE_REMOTE
        value: '1'
      - key: SITE_URL
        value: https://panikajeevansathi.onrender.com # canonical origin for robots/sitemap
      - key: SESSION_SECRET
        generateValue: true # keeps members logged in across restarts
      - key: ADMIN_EMAIL
        value: sukulpanika939@gmail.com
      - key: ADMIN_PASSWORD
        generateValue: true # view only in Render Environment; never logged

      # ---- Supabase (database + photos) — set these in the Render dashboard ----
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: uploads

      # ---- Transactional email — set these protected values in Render ---------
      # The safety monitor requires SMTP for account verification and recovery.
      # `sync: false` keeps all provider details and credentials out of Git.
      # Use either STARTTLS on 587 or SMTPS on 465 with SMTP_SECURE=true.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: MAIL_FROM
        sync: false

      # ---- Cloudflare D1 (optional fallback) ----------------------------------
      - key: CF_ACCOUNT_ID
        sync: false
      - key: CF_D1_DATABASE_ID
        sync: false
      - key: CF_D1_API_TOKEN
        sync: false

      # ---- Cloudflare R2 (optional fallback photos) ---------------------------
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false

# ---------------------------------------------------------------------------
# SEVA MARKET INDIA — the second service in this same Blueprint.
#
# Render drives this workspace from ONE Blueprint file: the render.yaml at the
# repository root. So the service lives here too, and its definition is kept
# byte-identical to `seva-market-india/render.yaml` (that file exists so the
# folder still deploys if it ever becomes a repository of its own — and
# `seva-market-india/tests/blueprint.test.mjs` fails the build if the two ever
# drift apart).
#
# It is a separate service, on its own free instance, with its own SQLite
# catalog and its own Supabase tables (seva_users / seva_leads /
# seva_audit_logs — `seva-market-india/scripts/supabase-storage.sql`).
# Nothing is shared with the matrimonial app except the repository and, if you
# like, the Supabase project; the seva_ prefix is what keeps those apart.
#
# Setting the two SUPABASE_* values is the only manual step, and
# SEVA_REQUIRE_REMOTE=1 means the service refuses to boot without them rather
# than quietly writing customer enquiries to an ephemeral disk.

  - type: web
    name: seva-market-india
    runtime: node
    plan: free
    region: singapore # closest Render region to India
    rootDir: seva-market-india
    buildCommand: npm ci --omit=dev --ignore-scripts || npm install --omit=dev --ignore-scripts
    startCommand: node server.js
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.22.3 # built-in node:sqlite + global fetch
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY_HOPS
        value: '1' # Render's edge appends the client address

      # ---- durability ----
      - key: SEVA_STORAGE
        value: supabase # accounts + enquiries go to Postgres, never to this disk
      - key: SEVA_REQUIRE_REMOTE
        value: '1' # fail closed: no Supabase config -> no boot
      - key: SEVA_SEED_ON_BOOT
        value: '1' # rebuild the catalog after the filesystem is wiped

      # ---- Supabase: set these two in the dashboard, they are secrets ----
      - key: SUPABASE_URL
        sync: false # https://<ref>.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false # Project Settings -> API -> service_role (NOT anon)

      # ---- app ----
      - key: SITE_URL
        # Not pinned on purpose: if the service name was taken Render suffixes
        # the public URL (seva-market-india -> seva-market-india-tast), and a
        # committed value would keep pointing at the wrong host after every
        # blueprint sync. Set the URL Render actually gave you in the dashboard
        # (Settings -> Environment); sync:false keeps that value from ever being
        # overwritten, and the boot guard warns if it disagrees with the host.
        sync: false
      - key: SESSION_SECRET
        generateValue: true # also salts the IP hash used by the enquiry throttle

      # ---- account email: verification + password reset ----
      # The app boots and serves every page without these; it simply cannot
      # mail a link, and the signup / reset pages say so instead of pretending.
      # All six are provider credentials, so `sync: false` keeps them out of
      # git: enter them in the dashboard (Settings -> Environment).
      # Indian hosts offer two shapes — STARTTLS on 587, or implicit TLS on
      # 465 with SMTP_SECURE=true. Leave SMTP_SECURE unset for the first.
      - key: SMTP_HOST
        sync: false # e.g. smtp.resend.com, smtp.zeptomail.in, smtp.gmail.com
      - key: SMTP_PORT
        sync: false # 587 (STARTTLS) or 465 (with SMTP_SECURE=true)
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_SECURE
        sync: false # 'true' only for implicit TLS on 465
      - key: MAIL_FROM
        sync: false # SEVA MARKET INDIA <no-reply@your-domain> — the domain must be one the provider lets you send from
      # Render's disk is ephemeral, so a mail outbox here would be a queue the
      # next deploy deletes. SEVA_MAIL_OUTBOX=1 exists for a debugging session
      # only; leave it unset and let undelivered mail be reported, not stored.
      - key: SEVA_MAIL_OUTBOX
        sync: false
