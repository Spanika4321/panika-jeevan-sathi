# PANIKA JEEVAN SATHI — Render Blueprint (Free plan)
#
# Deploy: Render dashboard → New + → Blueprint → pick this repository.
# This Blueprint creates the service `panikajeevansathi`, so the public URL is:
#
#     https://panikajeevansathi.onrender.com
#
# IMPORTANT — why there is no disk here:
# Render's Free plan has an *ephemeral* filesystem and cannot attach a
# persistent disk, so a normal SQLite file would be erased every time the
# service sleeps (15 min idle) or redeploys. This Blueprint therefore keeps
#   • the member database in Cloudflare D1  (free: 500 MB, no expiry), and
#   • uploaded photos in Cloudflare R2      (free: 10 GB, no egress fees).
# Both are reached over HTTPS by lib/d1.js and lib/r2.js — no paid add-ons.
#
# Fill in the seven blank values (marked "set in dashboard") when prompted:
# see DEPLOY.md § "Render — Free plan" for the 5-minute Cloudflare setup.
#
# Without those values the site still boots, but it uses the local SQLite file
# and will lose its data on the next restart (fine for a demo, not production).
# To keep the database durable WITHOUT Cloudflare, switch the service to
# Render Starter and attach a persistent disk mounted at /app/data, then set
# PJS_STORAGE=sqlite.

services:
  - type: web
    name: panikajeevansathi
    runtime: node
    plan: free
    region: singapore # closest Render region to India
    buildCommand: node -v # zero dependencies: nothing to install
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeploy: true # redeploy automatically when main changes
    envVars:
      - key: NODE_VERSION
        value: 22.22.3 # built-in node:sqlite (and global fetch) required
      - key: HOST
        value: 0.0.0.0
      - key: PJS_STORAGE
        value: auto # auto → D1 when CF_* is set, else local SQLite
      - key: SITE_URL
        value: https://panikajeevansathi.onrender.com # canonical origin for robots/sitemap
      - key: SESSION_SECRET
        generateValue: true # keeps members logged in across restarts
      - key: ADMIN_EMAIL
        value: sukulpanika939@gmail.com
      - key: ADMIN_PASSWORD
        generateValue: true # printed once in the deploy log; change it after login

      # ---- Cloudflare D1 (database) — set these in the Render dashboard ----
      - key: CF_ACCOUNT_ID
        sync: false
      - key: CF_D1_DATABASE_ID
        sync: false
      - key: CF_D1_API_TOKEN
        sync: false

      # ---- Cloudflare R2 (photos) — set these in the Render dashboard ------
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false

      # ---- SEO Center: Google Search Console (set these in the dashboard) --
      # Google Cloud Console → OAuth client (Web application) →
      #   Authorized redirect URI:
      #   https://panikajeevansathi.onrender.com/api/seo/oauth/callback
      # Values are intentionally not stored in Git; the site reports the stage
      # as NOT CONNECTED until they exist, never as a fake PASS.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_SEARCH_CONSOLE_SITE
        value: sc-domain:panikajeevansathi.com   # Search Console domain property

      # ---- SEO Center: AI providers (Gemini first, Router as fallback) -----
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_ROUTER_API_KEY
        sync: false
      - key: GEMINI_ROUTER_URL
        sync: false
      - key: GEMINI_ROUTER_MODEL
        sync: false

      # ---- SEO Center: daily cycle inside the running service --------------
      # The dashboard shows the next run time. If you install
      # ops/seo-cycle.workflow.yml as .github/workflows/seo-cycle.yml, set
      # this to 0 instead so the cycle is not run twice a day.
      - key: SEO_SCHEDULER
        value: "1"
      - key: SEO_CYCLE_INTERVAL_MINUTES
        value: "1440"
      - key: SEO_CYCLE_ON_BOOT
        value: "0"

      # ---- Owner email report (optional; drafts land in data/outbox/) ------
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false

      # ---- Filecoin mirror of the SEO reports (optional permanence) ---------
      - key: FIL_ONE_ENDPOINT
        sync: false
      - key: FIL_ONE_ACCESS_KEY
        sync: false
      - key: FIL_ONE_SECRET_KEY
        sync: false
      - key: FIL_ONE_BUCKET
        sync: false

      # ---- Search-engine presentation --------------------------------------
      # Search Console → verify property → HTML tag → paste ONLY the token.
      # It is injected into every public page at render time (no file edits,
      # so the approved design stays byte-identical).
      - key: GOOGLE_SITE_VERIFICATION
        sync: false
      # Where /security.txt tells researchers to report a problem.
      - key: SECURITY_EMAIL
        sync: false
