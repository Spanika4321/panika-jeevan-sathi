services:
  - type: web
    name: panika-jeevan-sathi
    runtime: node
    # ⚠ A persistent disk is only allowed on a PAID Render instance type.
    # `plan: free` + `disk:` is rejected, and deploying on the free plan with no
    # disk wipes every member, photo and message on each restart or redeploy.
    # Starter is the cheapest instance that can attach the disk below.
    plan: starter
    buildCommand: node -v
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.22.3
      - key: HOST
        value: 0.0.0.0
      - key: PJS_DATA_DIR
        value: /var/data/pjs
      - key: SESSION_SECRET
        generateValue: true
    disk:
      name: pjs-data
      mountPath: /var/data/pjs
      sizeGB: 1   # the whole site (database + photos) lives here — never remove
    # Set PJS_BACKUP_MIRROR to a second mounted path (or leave unset and use the
    # admin panel's Backup tab to download copies) so a lost disk is survivable.
