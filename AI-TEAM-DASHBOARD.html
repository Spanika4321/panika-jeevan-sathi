*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Segoe UI",Helvetica,Arial,sans-serif;background:#0c1317;color:var(--text);height:100vh;overflow:hidden}
.app{display:flex;height:100vh}
.sidebar{width:400px;min-width:320px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column}

.icon-btn{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;padding:6px;border-radius:6px}
.icon-btn:hover{background:var(--panel-2);color:var(--text)}
.side-banner{padding:12px 16px;background:#182229;border-bottom:1px solid var(--border)}
.banner-title{font-size:13.5px;font-weight:600;color:var(--accent)}
.banner-sub{font-size:12px;color:var(--muted);margin-top:3px}
.search-box{padding:8px 12px}
.search-box input{width:100%;padding:9px 14px;border-radius:8px;border:none;outline:none;background:var(--panel-2);color:var(--text);font-size:13.5px}
.chat-list{flex:1;overflow-y:auto}
.chat-item{display:flex;gap:13px;align-items:center;padding:11px 16px;cursor:pointer;border-bottom:1px solid #18222988;transition:background .12s}
.chat-item:hover{background:var(--panel-2)}
.chat-item.active{background:#2a3942}
.avatar{width:47px;height:47px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;font-weight:700;flex-shrink:0}
.chat-item-mid{flex:1;min-width:0}
.chat-item-top{display:flex;justify-content:space-between;align-items:baseline}
.chat-item-name{font-size:15px;font-weight:500}
.chat-item-time{font-size:11.5px;color:var(--muted)}
.chat-item-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:3px}
.chat-item-last{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:250px}
.unread-badge{background:var(--accent);color:#111;font-size:11px;font-weight:700;min-width:19px;height:19px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 5px}
.online-dot{width:10px;height:10px;border-radius:50%;background:#06cf9c;border:2px solid var(--panel);position:absolute;bottom:1px;right:1px}
.avatar-wrap{position:relative}
.side-foot{padding:10px 16px;font-size:11.5px;color:var(--muted);border-top:1px solid var(--border);text-align:center}
.chat-panel{flex:1;display:flex;flex-direction:column;background:radial-gradient(circle at 20% 30%,rgba(255,255,255,.012) 0 2px,transparent 3px),radial-gradient(circle at 70% 60%,rgba(255,255,255,.012) 0 2px,transparent 3px),var(--bg);background-size:180px 180px,240px 240px,auto}
.chat-head{display:flex;align-items:center;gap:13px;padding:10px 16px;background:#202c33;border-bottom:1px solid var(--border)}
.chat-head-info{flex:1;display:flex;flex-direction:column}
.chat-head-info strong{font-size:15.5px}
.chat-head-info span{font-size:12.5px;color:var(--muted)}
.chat-head-info span.typing{color:var(--accent);font-style:italic}
.chat-head-actions{display:flex;gap:8px}
.pill-btn{background:var(--panel-2);color:var(--text);border:1px solid var(--border);border-radius:999px;padding:7px 14px;font-size:12.5px;cursor:pointer;transition:background .12s}

.pill-btn.green{background:var(--accent);color:#08110f;font-weight:600;border:none}
.messages{flex:1;overflow-y:auto;padding:18px 7% 12px;display:flex;flex-direction:column;gap:3px}
.day-chip{align-self:center;background:#182229;color:var(--muted);font-size:11.5px;padding:5px 12px;border-radius:7px;margin:12px 0 6px}
.enc-chip{align-self:center;text-align:center;background:#182229;color:#ffd279;font-size:12px;padding:7px 14px;border-radius:8px;margin:8px 0 12px;max-width:80%}
.msg-row{display:flex;margin-top:2px}
.msg-row.out{justify-content:flex-end}
.bubble{position:relative;max-width:62%;padding:6px 9px 8px 10px;border-radius:9px;font-size:14.2px;line-height:1.42;word-wrap:break-word;white-space:pre-wrap;box-shadow:0 1px 1px rgba(0,0,0,.28);animation:pop .14s ease-out}

.msg-row.in .bubble{background:var(--in);border-top-left-radius:2px}
.msg-row.out .bubble{background:var(--out);border-top-right-radius:2px}
.bubble .sender{font-size:12.5px;font-weight:700;display:block;margin-bottom:2px}
.bubble .meta{float:right;margin:8px 0 -4px 10px;font-size:10.5px;color:rgba(233,237,239,.55);display:inline-flex;align-items:center;gap:3px}
.tick{font-size:14px;letter-spacing:-3px}
.tick.read{color:var(--tick)}
.bubble.code{font-family:Consolas,monospace;font-size:13px;background:#111;border:1px dashed var(--accent);color:var(--accent);text-align:center;font-weight:700;letter-spacing:2px}
.bubble.report{max-width:78%;font-size:13.3px}
.typing-row{display:flex;margin-top:4px}
.typing-bubble{background:var(--in);border-radius:9px;border-top-left-radius:2px;padding:12px 16px;display:flex;gap:5px;align-items:center}

.typing-bubble span:nth-child(2){animation-delay:.2s}
.typing-bubble span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
.quick-actions{display:flex;gap:8px;padding:8px 16px 2px;overflow-x:auto;scrollbar-width:none}
.quick-actions::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;background:var(--panel-2);border:1px solid var(--border);color:var(--text);border-radius:999px;font-size:12.5px;padding:7px 14px;cursor:pointer}
.chip:hover{background:#2f4552}
.composer{display:flex;align-items:center;gap:10px;padding:10px 16px 14px;background:var(--panel)}
.composer-emoji{background:none;border:none;font-size:24px;cursor:pointer}
#msgInput{flex:1;background:var(--panel-2);color:var(--text);border:none;outline:none;border-radius:10px;padding:12px 18px;font-size:14.5px}
.send-btn{width:44px;height:44px;border-radius:50%;border:none;background:var(--accent);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
.send-btn:hover{background:#06c295}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:50}
.modal.hidden{display:none}
.modal-card{width:min(760px,92vw);max-height:86vh;background:var(--panel);border:1px solid var(--border);border-radius:14px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:#202c33;font-size:15px}
.email-body{flex:1;overflow-y:auto;margin:0;padding:20px 22px;font-family:"Segoe UI",sans-serif;font-size:13.5px;line-height:1.55;white-space:pre-wrap;color:#d6e2e9;background:#0c1418}

::-webkit-scrollbar{width:7px}
::-webkit-scrollbar-thumb{background:#2a3942;border-radius:4px}
::-webkit-scrollbar-track{background:transparent}
@media(max-width:860px){.sidebar{width:130px;min-width:130px}.chat-item-mid,.side-banner,.search-box,.side-foot,.boss-info{display:none}.chat-item{justify-content:center}.bubble{max-width:82%}.chat-head-actions{display:none}}
</style>

function rand(a){ return a[Math.floor(Math.random()*a.length)]; }
function rnd(min,max){ return min + Math.floor(Math.random()*(max-min+1)); }

  msgs.forEach(function(m){

      chip.textContent = day===new Date().toDateString()?'TODAY':new Date(m.ts).toLocaleDateString('en-IN',{day:'numeric',month:'short'});
      wrap.appendChild(chip);

function typingDelay(text){ return Math.min(3400,700+text.length*9)+rnd(0,350); }

function analyzeHtml(html){
  var title=(html.match(/<title[^>]*>([^<]*)<\/title>/i)||[])[1]||'';
  var metaDesc=(html.match(/<meta[^>]+name=["']description["'][^>]*content=["']([^"']*)["']/i)||[])[1]||'';
  return {
    title:title.trim(), titleLen:title.trim().length,
    metaDesc:metaDesc.trim(), metaDescLen:metaDesc.trim().length,
    hasViewport:/<meta[^>]+name=["']viewport["']/i.test(html),
    h1Count:(html.match(/<h1[\s>]/gi)||[]).length,
    imgs:(html.match(/<img[\s>]/gi)||[]).length,
    imgNoAlt:(html.match(/<img(?![^>]*\salt=)[^>]*>/gi)||[]).length,
    links:(html.match(/<a[\s][^>]*href/gi)||[]).length,
    hasFavicon:/<link[^>]+rel=["'][^"']*icon[^"']*["']/i.test(html),
    hasOgTags:/<meta[^>]+property=["']og:/i.test(html),
    hasCanonical:/<link[^>]+rel=["']canonical["']/i.test(html)
  };
}
function fetchChain(url,isOkCheck){
  var attempts=[
    function(){ return fetch(url,{redirect:'follow'}); },
    function(){ return fetch('https://api.allorigins.win/raw?url='+encodeURIComponent(url)); },
    function(){ return fetch('https://corsproxy.io/?url='+encodeURIComponent(url)); }
  ];
  var i=0;
  function next(){
    if (i>=attempts.length) return Promise.reject(new Error('unreachable'));
    var a=attempts[i++];
    return a().then(function(r){ if(isOkCheck) return r.ok; if(!r.ok) throw new Error('bad'); return r.text(); })
      .catch(function(){ return next(); });
  }
  return next();
}

  var snehaLine=recommendAds

  var body='Hello Good Morning Boss! Here is our action plan for today to maximize our growth using free tools.\n\n'+

var lastEmail=null;
function groupEmailFlow(){
  return employeeSay('amit','team','📧 Boss ne Daily Growth Email maanga hai — team, apne sections ready karo!')
    .then(function(){ lastEmail=buildDailyEmail(); return sleep(600); })
    .then(function(){ return employeeSay('rahul','team','1️⃣ RAHUL: Aaj Trends par '+lastEmail.trendCount+' live trends mile. Free Google Tools se 2 naye keywords nikal raha hoon:\n• "free matrimonial site for Panika community"\n• "free kundali matching for marriage online"\nDetail email me hai 🫡'); })
    .then(function(){ return sleep(700); })
    .then(function(){ return employeeSay('priya','team','2️⃣ PRIYA: "#FreeForever Shaadi Week" launch 🎯 Reel 6 PM, WhatsApp status 9 AM + 8 PM, 10 Facebook groups. Target: 50+ registrations 🔥'); })
    .then(function(){ return sleep(700); })
    .then(function(){
      if (lastEmail.trendCount>=3) return employeeSay('amit','team','3️⃣ AMIT: Multiple trends live hain — Boss, the workload is high today, so I am cloning our workflow to create 3 extra sub-agents to handle the extra posts automatically. ⚡');
      return employeeSay('amit','team','3️⃣ AMIT: Workload stable hai Boss — core workflow sab sambhal raha hai ⚡');
    })
    .then(function(){ return sleep(700); })
    .then(function(){
      if (lastEmail.recommendAds){
        return employeeSay('sneha','team','4️⃣ SNEHA: Virality '+lastEmail.viralScore+'/100 🔥 Boss, organic growth is peaking. I recommend we start Ads today.\n\n🎯 Ad Hook: '+rand(AD_HOOKS))
          .then(function(){ return sleep(500); })
          .then(function(){ push({chat:'team',from:'sneha',text:'LAUNCH_ADS',code:true}); return sleep(300); });
      }
      return employeeSay('sneha','team','4️⃣ SNEHA: Virality '+lastEmail.viralScore+'/100 — solid! Aaj organic push karte hain 📈');
    })
    .then(function(){ return sleep(400); })
    .then(function(){ return employeeSay('amit','team','📧 Full email ready hai Boss — upar 📧 button se kholiye!'); })
    .then(function(){ openEmailModal(lastEmail); });
}
function openEmailModal(email){
  lastEmail=email||buildDailyEmail();
  $('#emailBody').textContent='Subject: '+lastEmail.subject+'\n\n'+lastEmail.body;
  $('#emailModal').classList.remove('hidden');
}

/* ---------------- WIRING ---------------- */
function wire(){
  $('#sendBtn').addEventListener('click',function(){ bossSend($('#msgInput').value); $('#msgInput').value=''; });
  $('#msgInput').addEventListener('keydown',function(e){ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); bossSend($('#msgInput').value); $('#msgInput').value=''; } });
  $('#searchInput').addEventListener('input',renderChatList);
  $('#emojiBtn').addEventListener('click',function(){ var inp=$('#msgInput'); inp.value+=rand(['🙏','🔥','💪','🚀','😊','👍','💚','⚡']); inp.focus(); });
  $('#emailBtn').addEventListener('click',function(){ openEmailModal(); });
  $('#closeModal').addEventListener('click',function(){ $('#emailModal').classList.add('hidden'); });
  $('#emailModal').addEventListener('click',function(e){ if(e.target===$('#emailModal')) $('#emailModal').classList.add('hidden'); });
  $('#copyEmail').addEventListener('click',function(){
    if(!lastEmail) lastEmail=buildDailyEmail();
    navigator.clipboard.writeText('Subject: '+lastEmail.subject+'\n\n'+lastEmail.body)
      .then(function(){ $('#copyEmail').textContent='✅ Copied!'; setTimeout(function(){ $('#copyEmail').textContent='📋 Copy Email'; },1600); })
      .catch(function(){ alert('Copy nahi hua — email text manually select kar lijiye.'); });
  });
  $('#sendToChat').addEventListener('click',function(){ $('#emailModal').classList.add('hidden'); openChat('team'); groupEmailFlow(); });
  $('#auditBtn').addEventListener('click',function(){ openChat('team'); bossSend('audit karo'); });
  $('#postsBtn').addEventListener('click',function(){ openChat('team'); bossSend('aaj ke posts banao'); });
}
function startLife(){
  setInterval(function(){
    if (document.hidden||state.typing.team) return;
    if (Date.now()-state.lastProactive<150000) return;
    if (Math.random()>0.3) return;
    var p=rand(PROACTIVE);
    state.lastProactive=Date.now();
    push({chat:'team',from:p[0],text:p[1]});
  },45000);
}
function init(){ load(); wire(); openChat('team'); startLife(); }
document.addEventListener('DOMContentLoaded',init);
</script>
