<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Reset password — PANIKA JEEVAN SATHI</title>
<meta name="theme-color" content="#8e1f41">
<link rel="icon" href="/assets/img/favicon.svg">
<link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>

<div id="siteHeader"></div>

<main class="auth-wrap">
  <section class="auth-card">
    <h1 style="font-size:26px">Set a new password</h1>
    <p class="muted small">Choose a strong password you have not used before.</p>

    <div id="msg"></div>

    <form id="form">
      <div class="field">
        <label for="pw">New password</label>
        <input id="pw" type="password" autocomplete="new-password" minlength="8" required placeholder="Minimum 8 characters">
        <div class="hint">At least 8 characters, including one letter and one number.</div>
      </div>
      <div class="field">
        <label for="pw2">Confirm new password</label>
        <input id="pw2" type="password" autocomplete="new-password" minlength="8" required>
      </div>
      <button class="btn block lg" type="submit" id="btn">Update password</button>
    </form>

    <p class="center small mt-2 muted"><a href="/login.html">Back to login</a></p>
  </section>
</main>

<div id="siteFooter"></div>

<script src="/assets/js/app.js"></script>
<script>
(function () {
  const msg = document.getElementById('msg');
  const form = document.getElementById('form');

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    const token = PJS.qs('token');
    const pw = document.getElementById('pw').value;
    const pw2 = document.getElementById('pw2').value;
    if (!token) { msg.innerHTML = '<div class="alert error">This reset link is invalid.</div>'; return; }
    if (pw !== pw2) { msg.innerHTML = '<div class="alert error">The two passwords do not match.</div>'; return; }
    const btn = document.getElementById('btn');
    btn.disabled = true; btn.textContent = 'Updating…';
    const res = await PJS.post('/api/auth/reset', { token: token, password: pw });
    btn.disabled = false; btn.textContent = 'Update password';
    if (res.ok) {
      form.classList.add('hide');
      msg.innerHTML = '<div class="alert success"><b>Password updated</b>' +
        'You can now log in with your new password.</div>' +
        '<a class="btn block lg" href="/login.html">Go to login</a>';
    } else {
      msg.innerHTML = '<div class="alert error">' + PJS.esc(res.error || 'Could not update password.') + '</div>';
    }
  });

  PJS.onReady(function () {
    if (!PJS.qs('token')) {
      msg.innerHTML = '<div class="alert error"><b>Invalid link</b>Please request a new password reset link.</div>';
    }
  });
})();
</script>
</body>
</html>
