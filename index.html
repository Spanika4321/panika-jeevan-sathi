<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Panika Jeevan Sathi</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#fff7f8;
  color:#333;
}

header{
  background:linear-gradient(135deg,#8e24aa,#e91e63);
  color:white;
  text-align:center;
  padding:28px 15px;
}

header h1{
  margin:0;
  font-size:30px;
}

header p{
  margin:8px 0 0;
  font-size:16px;
}

.container{
  max-width:700px;
  margin:auto;
  padding:20px 15px;
}

.card{
  background:white;
  padding:20px;
  margin-bottom:18px;
  border-radius:15px;
  box-shadow:0 3px 12px rgba(0,0,0,.10);
}

.card h2{
  margin-top:0;
  color:#8e24aa;
}

input,
select,
textarea{
  width:100%;
  padding:13px;
  margin:7px 0 14px;
  border:1px solid #ddd;
  border-radius:9px;
  font-size:16px;
}

textarea{
  min-height:110px;
  resize:vertical;
}

button{
  width:100%;
  padding:14px;
  border:0;
  border-radius:9px;
  background:#e91e63;
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  opacity:.9;
}

.profile{
  border:1px solid #eee;
  padding:15px;
  border-radius:12px;
  margin-top:12px;
}

.profile h3{
  margin:0 0 8px;
  color:#8e24aa;
}

footer{
  text-align:center;
  padding:20px;
  color:#777;
  font-size:14px;
}
</style>
</head>

<body>

<header>
  <h1>💞 Panika Jeevan Sathi</h1>
  <p>जीवनसाथी की तलाश का अपना भरोसेमंद मंच</p>
</header>

<div class="container">

  <div class="card">
    <h2>🌸 अपना Profile बनाएं</h2>

    <input
      id="name"
      type="text"
      placeholder="पूरा नाम">

    <input
      id="age"
      type="number"
      placeholder="उम्र">

    <select id="gender">
      <option value="">लिंग चुनें</option>
      <option value="पुरुष">पुरुष</option>
      <option value="महिला">महिला</option>
    </select>

    <input
      id="city"
      type="text"
      placeholder="शहर">

    <input
      id="education"
      type="text"
      placeholder="शिक्षा">

    <input
      id="occupation"
      type="text"
      placeholder="व्यवसाय / नौकरी">

    <textarea
      id="bio"
      placeholder="अपने बारे में लिखें"></textarea>

    <button onclick="saveProfile()">
      💾 Profile Save करें
    </button>
  </div>

  <div class="card">
    <h2>🔎 Profile खोजें</h2>

    <input
      id="search"
      type="text"
      placeholder="नाम या शहर से खोजें"
      oninput="searchProfiles()">

    <div id="profiles">
      <p>अभी कोई profile नहीं है।</p>
    </div>
  </div>

</div>

<footer>
  © 2026 Panika Jeevan Sathi
</footer>

<script>

let profiles =
  JSON.parse(localStorage.getItem("panikaProfiles")) || [];

function saveProfile(){

  const name =
    document.getElementById("name").value.trim();

  const age =
    document.getElementById("age").value;

  const gender =
    document.getElementById("gender").value;

  const city =
    document.getElementById("city").value.trim();

  const education =
    document.getElementById("education").value.trim();

  const occupation =
    document.getElementById("occupation").value.trim();

  const bio =
    document.getElementById("bio").value.trim();

  if(!name || !age || !gender || !city){

    alert("कृपया नाम, उम्र, लिंग और शहर भरें।");

    return;
  }

  const profile = {
    id:Date.now(),
    name:name,
    age:age,
    gender:gender,
    city:city,
    education:education,
    occupation:occupation,
    bio:bio
  };

  profiles.push(profile);

  localStorage.setItem(
    "panikaProfiles",
    JSON.stringify(profiles)
  );

  alert("✅ आपका Profile सफलतापूर्वक Save हो गया।");

  document.getElementById("name").value="";
  document.getElementById("age").value="";
  document.getElementById("gender").value="";
  document.getElementById("city").value="";
  document.getElementById("education").value="";
  document.getElementById("occupation").value="";
  document.getElementById("bio").value="";

  displayProfiles(profiles);
}

function displayProfiles(list){

  const box =
    document.getElementById("profiles");

  if(list.length === 0){

    box.innerHTML =
      "<p>कोई profile नहीं मिली।</p>";

    return;
  }

  box.innerHTML =
    list.map(p => `

      <div class="profile">

        <h3>💗 ${escapeHTML(p.name)}</h3>

        <p>
          <b>उम्र:</b>
          ${escapeHTML(p.age)}
        </p>

        <p>
          <b>लिंग:</b>
          ${escapeHTML(p.gender)}
        </p>

        <p>
          <b>शहर:</b>
          ${escapeHTML(p.city)}
        </p>

        <p>
          <b>शिक्षा:</b>
          ${escapeHTML(p.education || "—")}
        </p>

        <p>
          <b>व्यवसाय:</b>
          ${escapeHTML(p.occupation || "—")}
        </p>

        <p>
          <b>About:</b>
          ${escapeHTML(p.bio || "—")}
        </p>

      </div>

    `).join("");
}

function searchProfiles(){

  const keyword =
    document
      .getElementById("search")
      .value
      .toLowerCase()
      .trim();

  const result =
    profiles.filter(p =>
      p.name.toLowerCase().includes(keyword) ||
      p.city.toLowerCase().includes(keyword)
    );

  displayProfiles(result);
}

function escapeHTML(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

displayProfiles(profiles);

</script>

</body>
</html>
