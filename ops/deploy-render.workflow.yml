# PANIKA JEEVAN SATHI — deploy to Render (Free plan)
#
# ⚠️ ACTIVATION REQUIRED (one-time, 2 minutes):
# GitHub does not allow automated tools to install workflows directly, so the
# owner must copy this file once:
#   1. On github.com open your repository → "Add file" → "Create new file"
#   2. Name it exactly:  .github/workflows/deploy-render.yml
#   3. Paste the FULL contents of this file and commit.
# After that it can be run from the Actions tab with one click.
#
# Run it from the Actions tab:  Actions → "Deploy to Render" → Run workflow.
# The Render API key is passed as an input and masked in the log, so nothing
# secret is ever committed to this repository.
#
# GitHub Actions runners can reach api.render.com (unlike a sandboxed dev
# machine), so this is the path to use when deploying from an agent session.

name: Deploy to Render

on:
  workflow_dispatch:
    inputs:
      render_api_key:
        description: 'Render API key (dashboard → Account Settings → API keys)'
        required: true
      branch:
        description: 'Git branch to deploy'
        required: false
        default: main
      cf_account_id:
        description: 'Cloudflare account ID (members + temporary photos)'
        required: true
      cf_d1_database_id:
        description: 'Cloudflare D1 database ID'
        required: true
      cf_d1_api_token:
        description: 'Cloudflare API token with D1:Edit'
        required: true
      admin_email:
        description: 'Site-owner administrator email'
        required: false
        default: sukulpanika939@gmail.com
      admin_password:
        description: 'Administrator password (leave blank → Render generates one)'
        required: false

jobs:
  deploy:
    name: Create/update service and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Mask secrets in the log
        run: |
          for value in "${{ inputs.render_api_key }}" "${{ inputs.cf_d1_api_token }}" "${{ inputs.admin_password }}"; do
            if [ -n "$value" ]; then echo "::add-mask::$value"; fi
          done

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'

      - name: Syntax check
        run: npm run check

      - name: Verify Cloudflare credentials (when supplied)
        if: inputs.cf_account_id != ''
        env:
          CF_ACCOUNT_ID: ${{ inputs.cf_account_id }}
          CF_D1_DATABASE_ID: ${{ inputs.cf_d1_database_id }}
          CF_D1_API_TOKEN: ${{ inputs.cf_d1_api_token }}
        run: node scripts/verify-cloud.mjs

      - name: Deploy to Render
        env:
          RENDER_API_KEY: ${{ inputs.render_api_key }}
        run: |
          node scripts/deploy-render.mjs \
            --branch "${{ inputs.branch }}" \
            --admin-email "${{ inputs.admin_email }}" \
            --cf-account-id "${{ inputs.cf_account_id }}" \
            --cf-d1-database-id "${{ inputs.cf_d1_database_id }}" \
            --cf-d1-api-token "${{ inputs.cf_d1_api_token }}" \
            --admin-password "${{ inputs.admin_password }}" \
          | tee deploy.log

      - name: Read the public URL
        id: url
        run: |
          # NOTE: block scalar is intentional — 'PUBLIC URL : ' contains ": "
          # which breaks a single-line YAML mapping value.
          site="$(grep -o 'PUBLIC URL : .*' deploy.log | head -1 | sed 's/PUBLIC URL : //')"
          echo "site=$site" >> "$GITHUB_OUTPUT"

      - name: Verify the live website
        env:
          SITE_URL: ${{ steps.url.outputs.site }}
        run: node scripts/verify-cloud.mjs --url "$SITE_URL"
