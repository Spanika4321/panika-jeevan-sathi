<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#312e81">
<title>Messages • PANIKA JEEVAN SATHI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f7f8fc;color:#20212a;font-family:Inter,system-ui,sans-serif}
button,input{font:inherit}button{cursor:pointer}
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #e5e6ed}
.nav{max-width:900px;margin:auto;padding:12px 15px;display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:9px;border:0;background:none;text-align:left}
.mark{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#172554,#4338ca);color:#fff;display:grid;place-items:center;font-weight:900}
.logo b{display:block;font-size:13px}.logo small{display:block;color:#777;font-size:10px}
.icon{border:0;background:#f1f2f6;border-radius:12px;padding:10px}
.wrap{max-width:700px;margin:auto;padding:18px 14px 100px}
h1{margin:0;font-size:28px}
.sub{color:#777;font-size:13px;margin:5px 0 17px}
.search{display:flex;gap:8px;background:#fff;border:1px solid #e3e4eb;border-radius:15px;padding:7px;margin-bottom:12px}
.search input{border:0;outline:0;flex:1;background:transparent;padding:7px}
.list{background:#fff;border:1px solid #e5e6ed;border-radius:20px;overflow:hidden}
.chat{width:100%;display:flex;align-items:center;gap:12px;padding:14px;border:0;border-bottom:1px solid #eee;background:#fff;text-align:left}
.chat:last-child{border-bottom:0}
.avatar{width:52px;height:52px;border-radius:50%;object-fit:cover}
.chatbody{flex:1;min-width:0}
.chatbody b{font-size:14px}
.chatbody p{margin:4px 0 0;color:#777;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.time{font-size:10px;color:#999}
.online{display:inline-block;width:8px;height:8px;border-radius:50%;background:#22c55e;margin-left:4px}
.unread{background:#312e81;color:#fff;border-radius:20px;padding:3px 7px;font-size:9px}
.empty{text-align:center;background:#fff;border:1px solid #e5e6ed;border-radius:20px;padding:40px 20px}
.empty .big{font-size:40px}
.empty h2{margin:8px 0 4px}.empty p{color:#777;font-size:12px}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:15;background:#fff;border-top:1px solid #e5e6ed;display:flex;justify-content:center;gap:clamp(18px,8vw,75px);padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
.bottom button{border:0;background:none;color:#777;display:grid;place-items:center}
.bottom .active{color:#312e81}
.bottom span{font-size:21px}.bottom small{font-size:10px}

.overlay{display:none;position:fixed;inset:0;background:#0008;z-index:50}
.overlay.show{display:block}
.chatbox{position:absolute;inset:0;background:#f7f8fc;display:flex;flex-direction:column}
.chathead{background:#fff;border-bottom:1px solid #ddd;padding:11px 14px;display:flex;align-items:center;gap:10px}
.chathead button{border:0;background:none;font-size:22px}
.chathead img{width:40px;height:40px;border-radius:50%;object-fit:cover}
.chathead b{display:block;font-size:13px}.chathead small{color:#22a35a;font-size:10px}
.chatmessages{flex:1;padding:18px;overflow:auto}
.bubble{max-width:78%;padding:10px 12px;border-radius:16px;margin:7px 0;font-size:12px;line-height:1.45}
.them{background:#fff;border:1px solid #e5e6ed;border-top-left-radius:5px}
.me{margin-left:auto;background:#312e81;color:#fff;border-top-right-radius:5px}
.chatinput{background:#fff;border-top:1px solid #ddd;padding:9px;display:flex;gap:7px}
.chatinput input{flex:1;border:1px solid #ddd;border-radius:20px;padding:10px 13px;outline:0}
.chatinput button{width:42px;border:0;border-radius:50%;background:#312e81;color:#fff}
</style>
</head>

<body>

<header class="top">
<div class="nav">
<button class="logo" onclick="goHome()">
<span class="mark">P</span>
<span><b>PANIKA JEEVAN SATHI</b><small>100% FREE • TRUST • RESPECT</small></span>
</button>
<button class="icon" onclick="goContact()">🛡️</button>
</div>
</header>

<main class="wrap">

<h1>Messages 💬</h1>
<p class="sub">Your private conversations and connections.</p>

<div class="search">
<span>⌕</span>
<input id="search" placeholder="Search conversations" oninput="render()">
</div>

<section id="list" class="list"></section>

</main>

<nav class="bottom">
<button onclick="goHome()"><span>⌂</span><small>Home</small></button>
<button onclick="goDiscover()"><span>⌕</span><small>Discover</small></button>
<button class="active"><span>💬</span><small>Messages</small></button>
<button onclick="goShortlist()"><span>☆</span><small>Shortlist</small></button>
<button onclick="goProfile()"><span>◯</span><small>Profile</small></button>
</nav>

<div class="overlay" id="chatOverlay">

<div class="chatbox">

<div class="chathead">
<button onclick="closeChat()">‹</button>
<img id="chatAvatar" src="">
<div>
<b id="chatName">Member</b>
<small>● Online</small>
</div>
</div>

<div class="chatmessages" id="chatMessages"></div>

<div class="chatinput">
<input id="messageInput" placeholder="Write a message…" onkeydown="enterSend(event)">
<button onclick="sendMessage()">➤</button>
</div>

</div>
</div>

<script>

const chats=[
{
id:1,
name:"Anjali Panika",
city:"Silchar",
avatar:"https://i.pravatar.cc/150?img=47",
last:"Hello! Nice to connect with you.",
time:"10:42 PM",
unread:2,
messages:[
{who:"them",text:"Hello! Nice to connect with you."},
{who:"me",text:"Hello Anjali 😊 Nice to connect with you too."}
]
},
{
id:2,
name:"Priya Manikpuri",
city:"Raipur",
avatar:"https://i.pravatar.cc/150?img=44",
last:"Thank you for your interest ❤️",
time:"Yesterday",
unread:0,
messages:[
{who:"them",text:"Thank you for your interest ❤️"}
]
},
{
id:3,
name:"Kavita Kabirpanthi",
city:"Kolkata",
avatar:"https://i.pravatar.cc/150?img=49",
last:"We can talk here first.",
time:"Mon",
unread:0,
messages:[
{who:"them",text:"We can talk here first."}
]
}
];

let activeChat=null;

function render(){

const q=document.getElementById("search").value.toLowerCase();

const result=chats.filter(c=>
(c.name+" "+c.city+" "+c.last).toLowerCase().includes(q)
);

const box=document.getElementById("list");

if(!result.length){
box.className="";
box.innerHTML=`
<div class="empty">
<div class="big">💬</div>
<h2>No conversations</h2>
<p>Your accepted connections will appear here.</p>
</div>`;
return;
}

box.className="list";

box.innerHTML=result.map(c=>`

<button class="chat" onclick="openChat(${c.id})">

<img class="avatar" src="${c.avatar}" alt="">

<div class="chatbody">
<b>${escapeHTML(c.name)} <span class="online"></span></b>
<p>${escapeHTML(c.last)}</p>
</div>

<div>
<div class="time">${c.time}</div>
${c.unread?`<div class="unread">${c.unread}</div>`:""}
</div>

</button>

`).join("");

}

function openChat(id){

activeChat=chats.find(c=>c.id===id);

if(!activeChat)return;

document.getElementById("chatName").textContent=activeChat.name;
document.getElementById("chatAvatar").src=activeChat.avatar;

renderMessages();

document.getElementById("chatOverlay").classList.add("show");

}

function renderMessages(){

const box=document.getElementById("chatMessages");

box.innerHTML=activeChat.messages.map(m=>`
<div class="bubble ${m.who}">
${escapeHTML(m.text)}
</div>
`).join("");

box.scrollTop=box.scrollHeight;

}

function sendMessage(){

const input=document.getElementById("messageInput");
const text=input.value.trim();

if(!text||!activeChat)return;

activeChat.messages.push({
who:"me",
text:text
});

activeChat.last=text;
activeChat.time="Now";
activeChat.unread=0;

input.value="";
renderMessages();
render();

}

function enterSend(e){

if(e.key==="Enter"){
e.preventDefault();
sendMessage();
}

}

function closeChat(){
document.getElementById("chatOverlay").classList.remove("show");
activeChat=null;
}

function escapeHTML(v){

return String(v).replace(/[&<>"']/g,m=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[m]));

}

function goHome(){location.href="index.html"}
function goDiscover(){location.href="discover.html"}
function goShortlist(){location.href="shortlist.html"}
function goProfile(){location.href="profile.html"}
function goContact(){location.href="contact.html"}

render();

</script>

</body>
</html>
